name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang needs >= 19: earlier Clang reports __cpp_concepts=201907,
          # which guards out libstdc++'s <expected>. Clang 19 bumped the macro,
          # so both compilers build against libstdc++.
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            clang_version: ""
          - compiler: clang
            cc: clang-19
            cxx: clang++-19
            clang_version: "19"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang
        if: matrix.clang_version != ''
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.clang_version }}
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cxx }}
      # DEXPP_WERROR: a compiler warning in the project's own sources (library,
      # C shim, tests) fails the build, under both compilers.
      - name: Configure
        run: cmake -S . -B build -DDEXPP_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-test-other:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Clang from the runner's default Xcode (16.4): its libc++ has
          # <expected>, <format> and std::jthread.
          - name: macOS arm64
            os: macos-15
          - name: macOS x86_64
            os: macos-15-intel
          # MSVC from the runner's Visual Studio.  The Visual Studio generator
          # builds several configurations; Debug is built and tested, like the
          # unoptimized Linux builds, with MSVC's checked iterators on.
          - name: Windows x64 MSVC
            os: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DDEXPP_WERROR=ON
      - name: Build
        run: cmake --build build -j --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-13
      - name: Configure
        run: cmake -S . -B build -DDEXPP_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        # Pinned to clang-format-18 so the gate matches the version the tree
        # was formatted with; a newer clang-format may reflow differently.
        run: |
          git ls-files '*.cc' '*.cpp' '*.hpp' '*.h' \
            | xargs clang-format-18 --dry-run -Werror

  thread-sanitizer:
    name: TSan (threaded stress)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-13
      # Newer kernels raise vm.mmap_rnd_bits to 32, which TSan cannot map its
      # shadow memory around; lower ASLR entropy before building, since
      # gtest_discover_tests runs the instrumented binary at build time.
      - name: Lower ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build -DDEXPP_SANITIZE=thread
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

  python:
    name: python bindings + wheel (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        # The oldest and the newest supported version.  The release builds and
        # tests a wheel for every version in between.
        python: ["3.10", "3.14"]
    defaults:
      run:
        # The same commands on every system (Git Bash on Windows).
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
      - name: Build extension in place
        run: |
          cmake -S . -B build -DDEXPP_BUILD_PYTHON=ON -DDEXPP_WERROR=ON \
            -DPYTHON_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build build -j --config Release
      - name: Run binding tests
        run: PYTHONPATH=build python bindings/python/test_dexpp.py
      # The examples the documentation shows, and the output it shows for them.
      - name: Run documentation examples
        run: PYTHONPATH=build python docs/examples/check.py
      # The examples write the type of every variable.  This checks those
      # types against the stubs, so an example cannot state a wrong type.
      - name: Type-check documentation examples
        run: |
          python -m pip install mypy==2.4.1
          MYPYPATH=bindings/python python -m mypy --strict docs/examples/*.py
      - name: Wheel install smoke test
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP" && python -c "import dexpp; print('import ok:', dexpp.__name__)"

  go:
    # Linux and macOS.  On Windows, cgo needs a MinGW toolchain; the Go package
    # does not support Windows.
    name: go bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Install toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
      - name: Build C shim
        run: cmake -S . -B build && cmake --build build --target dexpp_c -j
      - name: Run Go tests
        working-directory: bindings/go
        run: go test ./...
