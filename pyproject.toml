[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "dexpp"
dynamic = ["version"]
description = "Fast static analysis of Android APK / DEX files (C++ core with Python bindings)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Nasser" }]
keywords = ["android", "dex", "apk", "static-analysis", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/burogurama/dexpp"
Documentation = "https://burogurama.github.io/dexpp/"
Issues = "https://github.com/burogurama/dexpp/issues"
Changelog = "https://github.com/burogurama/dexpp/blob/main/CHANGELOG.md"

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.expand-macos-universal-tags = true
# The wheel contains exactly the extension module and its stub file,
# installed at site-packages root (single-module layout), plus the license of
# the bundled libdeflate in .dist-info.
wheel.packages = []
# The sdist carries only what the wheel build needs: the test fixtures (tens of
# MB, some of them third-party APKs), the documentation sources and CI config
# stay in the repository.
sdist.exclude = ["tests/", ".github/", "docs/", "mkdocs.yml"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/version.hpp"
regex = '#define DEXPP_VERSION "(?P<value>[^"]+)"'

[tool.scikit-build.cmake.define]
DEXPP_BUILD_PYTHON = "ON"
DEXPP_BUILD_TESTS = "OFF"

# Release wheels (built by .github/workflows/release.yml), for CPython 3.10 to
# 3.14 on every platform below.  The bindings use pybind11 without the stable
# ABI, so each Python version needs its own wheel.  The free-threaded build
# (cp314t) is not built: the bindings have not been audited for running
# without the GIL.
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
test-command = "cd {project} && python bindings/python/test_dexpp.py"

# macOS: one wheel per architecture, built and tested on a runner of that
# architecture (release.yml uses an arm64 and an x86_64 runner), so each wheel
# is tested where it will run.  The library needs macOS 13.3 or newer:
# std::format uses the floating-point std::to_chars that macOS added in 13.3.
# The target is 14.0, not 13.3, because a wheel tag only carries the major
# version for macOS 11 and later: a 13.3 build would be tagged macosx_13_0 and
# would install, then fail to load, on macOS 13.0 to 13.2.
[tool.cibuildwheel.macos]
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

# Windows: 64-bit x86 only.  The tests run in cmd.exe, where `cd` needs `/d`
# to also change the drive (the project and the test folder are on different
# drives on the runner).
[tool.cibuildwheel.windows]
archs = ["AMD64"]
test-command = "cd /d {project} && python bindings/python/test_dexpp.py"
